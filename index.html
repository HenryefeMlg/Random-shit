<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Henry Games Random Shit Generator</title>
    
    <!-- Mobil Uyumlu Plyr Video Oyuncusu CSS -->
    <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
    
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 15px;
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 20px;
            text-align: center;
            text-transform: uppercase;
        }

        .video-container {
            width: 100%;
            max-width: 640px;
            background-color: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0,0,0,0.7);
        }

        /* Plyr Tema Rengi */
        :root {
            --plyr-color-main: #ff4757;
        }

        button {
            margin-top: 20px;
            padding: 14px 28px;
            font-size: 1.1rem;
            font-weight: bold;
            color: #ffffff;
            background-color: #ff4757;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            max-width: 640px;
            transition: background 0.2s ease, transform 0.1s ease;
        }

        button:hover {
            background-color: #ff6b81;
        }

        button:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <h1>Henry Games Random Shit Generator</h1>

    <div class="video-container">
        <video id="player" playsinline controls>
            <source id="videoSource" src="" type="video/mp4">
            Tarayıcınız video etiketini desteklemiyor.
        </video>
    </div>

    <button id="generateBtn" onclick="playRandomVideo()">GENERATE RANDOM SHIT</button>

    <!-- Plyr JS -->
    <script src="https://cdn.plyr.io/3.7.8/plyr.polyfilled.js"></script>

    <script>
        // TOPLAM VİDEO SAYINIZ (Örn: 60 adet video varsa 60 yazın)
        const TOTAL_VIDEOS = 60; 
        
        let lastPlayed = null;

        // Modern Mobil Video Oyuncusunu Başlat
        const player = new Plyr('#player', {
            controls: ['play-large', 'play', 'progress', 'current-time', 'mute', 'volume', 'fullscreen'],
            autoplay: true
        });

        function playRandomVideo() {
            let randomIndex;
            
            // Aynı video üst üste denk gelmesin
            do {
                randomIndex = Math.floor(Math.random() * TOTAL_VIDEOS) + 1;
            } while (randomIndex === lastPlayed && TOTAL_VIDEOS > 1);

            lastPlayed = randomIndex;

            // GitHub'daki videos/1.mp4, videos/2.mp4 formatındaki yol
            const selectedVideoPath = `videos/${randomIndex}.mp4`;

            // Videoyu Plyr üzerinden yükle ve oynat
            player.source = {
                type: 'video',
                sources: [
                    {
                        src: selectedVideoPath,
                        type: 'video/mp4'
                    }
                ]
            };
            
            player.play();
        }

        // Sayfa açıldığında ilk rastgele videoyu oynat
        playRandomVideo();
    </script>

</body>
</html>
