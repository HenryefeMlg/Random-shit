<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Henry Games Random Shit Generator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 20px;
            text-align: center;
        }

        .video-container {
            width: 90%;
            max-width: 640px;
            aspect-ratio: 16 / 9;
            background-color: #000;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        button {
            margin-top: 20px;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: bold;
            color: #ffffff;
            background-color: #ff4757;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        button:hover {
            background-color: #ff6b81;
        }
    </style>
</head>
<body>

    <h1>Henry games random shit generator</h1>

    <div class="video-container">
        <iframe id="drivePlayer" src="" allow="autoplay" allowfullscreen></iframe>
    </div>

    <button onclick="playRandomVideo()">generate random shit</button>

    <script>
        // İlettiğin tam adresi buraya tanımladım:
        const scriptUrl = "https://script.google.com/macros/s/AKfycbw5P2VVSLE0IE6pJ9CQ47mrnL3RHdSKIjeEGpOqtaiy8-aUluq4D5OBp1I9pNZMuQydqw/exec";
        
        // Drive klasöründeki toplam video sayısı
        const totalVideos = 65; 

        async function playRandomVideo() {
            const randomNumber = Math.floor(Math.random() * totalVideos) + 1;
            
            try {
                const response = await fetch(`${scriptUrl}?num=${randomNumber}`);
                const fileId = await response.text();

                if (fileId && fileId.trim() !== "") {
                    const player = document.getElementById("drivePlayer");
                    player.src = `https://drive.google.com/file/d/${fileId.trim()}/preview`;
                } else {
                    console.error("Video ID alınamadı, numara: " + randomNumber);
                }
            } catch (e) {
                console.error("Bağlantı hatası:", e);
            }
        }

        // Sayfa açıldığında ilk videoyu oynat
        playRandomVideo();
    </script>

</body>
</html>
