<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Henry Games Random Shit Generator</title>
    
    <!-- Mobil Uyumlu Plyr Video Oynatıcı CSS -->
    <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
    
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0b0c10;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 15px;
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 20px;
            text-align: center;
            color: #66fcf1;
            text-shadow: 0 0 10px rgba(102, 252, 241, 0.3);
            text-transform: uppercase;
        }

        .video-container {
            width: 100%;
            max-width: 650px;
            background-color: #1f2833;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.7);
            border: 2px solid #45a29e;
        }

        /* Plyr tema özelleştirmeleri */
        :root {
            --plyr-color-main: #66fcf1;
            --plyr-video-control-color: #ffffff;
        }

        button {
            margin-top: 20px;
            width: 100%;
            max-width: 650px;
            padding: 16px;
            font-size: 1.1rem;
            font-weight: bold;
            color: #0b0c10;
            background: linear-gradient(135deg, #66fcf1, #45a29e);
            border: none;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(102, 252, 241, 0.3);
            transition: transform 0.1s ease, background 0.2s ease;
        }

        button:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <h1>Henry Games Random Shit Generator</h1>

    <div class="video-container">
        <!-- Mobil Dostu Video Oynatıcı -->
        <video id="player" playsinline controls preload="metadata">
            <source id="videoSource" src="" type="video/mp4">
            Tarayıcınız video etiketini desteklemiyor.
        </video>
    </div>

    <button id="generateBtn" onclick="playRandomVideo()">GENERATE RANDOM SHIT</button>

    <!-- Plyr JS -->
    <script src="https://cdn.plyr.io/3.7.8/plyr.polyfilled.js"></script>

    <script>
        // Plyr Mobil Uyumlu Player'ı Başlat
        const player = new Plyr('#player', {
            controls: ['play-large', 'play', 'progress', 'current-time', 'mute', 'volume', 'fullscreen'],
            autoplay: true
        });

        // DRIVE VE VİDEO AYARLARI
        const folderId = "1Xgc4VGChclfwkRP0e3kTNtmv54bjfBsP";
        const totalVideos = 60; // Klasördeki toplam video sayınız (Örn: 1.mp4, 2.mp4 ... 60.mp4)

        let lastPlayed = null;

        function playRandomVideo() {
            let randomNum;
            // Üst üste aynı videonun gelmesini engelle
            do {
                randomNum = Math.floor(Math.random() * totalVideos) + 1;
            } while (randomNum === lastPlayed && totalVideos > 1);
            
            lastPlayed = randomNum;

            // Google Drive doğrudan dosya adı akış URL'si
            const videoUrl = `https://drive.google.com/uc?export=download&id=${folderId}&filename=${randomNum}.mp4`;

            // Videoyu Player'a Yükle ve Oynat
            player.source = {
                type: 'video',
                sources: [
                    {
                        src: videoUrl,
                        type: 'video/mp4',
                    }
                ]
            };
            
            player.play().catch(err => console.log("Otomatik oynatma kısıtlandı:", err));
        }
    </script>

</body>
</html>
