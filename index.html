<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Henry Games Random Shit Generator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 20px;
            text-align: center;
        }

        .video-container {
            width: 90%;
            max-width: 640px;
            aspect-ratio: 16 / 9;
            background-color: #000;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        video {
            width: 100%;
            height: 100%;
            display: block;
        }

        button {
            margin-top: 20px;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: bold;
            color: #ffffff;
            background-color: #ff4757;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        button:hover {
            background-color: #ff6b81;
        }

        button:disabled {
            background-color: #555;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <h1>Henry games random shit generator</h1>

    <div class="video-container">
        <video id="randomVideo" controls autoplay muted>
            <source id="videoSource" src="" type="video/mp4">
            Tarayıcınız video etiketini desteklemiyor.
        </video>
    </div>

    <button id="generateBtn" onclick="playRandomVideo()" disabled>Videolar Taranıyor...</button>

    <script>
        let maxVideoCount = 0;

        // Klasördeki en son videonun numarasını otomatik bulur
        async function detectTotalVideos() {
            let count = 1;
            while (true) {
                try {
                    // Videonun var olup olmadığını kontrol et (HEAD isteği)
                    const response = await fetch(`videos/${count}.mp4`, { method: 'HEAD' });
                    if (response.ok) {
                        count++;
                    } else {
                        break; // Video bulunamadığı an döngüyü bitir
                    }
                } catch (e) {
                    break;
                }
            }
            
            maxVideoCount = count - 1;
            const btn = document.getElementById("generateBtn");

            if (maxVideoCount > 0) {
                btn.innerText = "generate random shit";
                btn.disabled = false;
                playRandomVideo();
            } else {
                btn.innerText = "Hiç video bulunamadı!";
            }
        }

        function playRandomVideo() {
            if (maxVideoCount === 0) return;

            // 1 ile bulunan en son video sayısı arasında seçim yapar
            const randomNumber = Math.floor(Math.random() * maxVideoCount) + 1;
            
            const videoPlayer = document.getElementById("randomVideo");
            const videoSource = document.getElementById("videoSource");

            videoSource.src = `videos/${randomNumber}.mp4`;
            videoPlayer.load();
            videoPlayer.play();
        }

        // Sayfa açıldığında mevcut videoları tara
        detectTotalVideos();
    </script>

</body>
</html>
