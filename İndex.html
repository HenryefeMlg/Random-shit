<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Henry Games Random Shit Generator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 20px;
            text-align: center;
        }

        .video-container {
            width: 90%;
            max-width: 640px;
            aspect-ratio: 16 / 9;
            background-color: #000;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        button {
            margin-top: 20px;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: bold;
            color: #ffffff;
            background-color: #ff4757;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        button:hover {
            background-color: #ff6b81;
        }

        button:disabled {
            background-color: #555;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <h1>Henry games random shit generator</h1>

    <div class="video-container">
        <iframe id="drivePlayer" src="" allow="autoplay"></iframe>
    </div>

    <button id="generateBtn" onclick="playRandomVideo()" disabled>Videolar Yükleniyor...</button>

    <script>
        const driveFolderId = "1Xgc4VGChclfwkRP0e3kTNtmv54bjfBsP";
        let videoList = [];

        async function fetchDriveVideos() {
            const btn = document.getElementById("generateBtn");
            try {
                const proxyUrl = "https://api.allorigins.win/get?url=" + encodeURIComponent(`https://drive.google.com/embeddedfolderview?id=${driveFolderId}`);
                const response = await fetch(proxyUrl);
                const data = await response.json();
                
                const regex = /\/file\/d\/([a-zA-Z0-9_-]+)/g;
                let match;
                const ids = new Set();

                while ((match = regex.exec(data.contents)) !== null) {
                    ids.add(match[1]);
                }

                videoList = Array.from(ids);

                if (videoList.length > 0) {
                    btn.innerText = "generate random shit";
                    btn.disabled = false;
                    playRandomVideo(); // İlk açılışta da rastgele bir video seçsin
                } else {
                    btn.innerText = "Klasörde video bulunamadı!";
                }
            } catch (error) {
                console.error("Hata:", error);
                btn.innerText = "Videolar yüklenemedi!";
            }
        }

        function playRandomVideo() {
            if (videoList.length === 0) return;

            const randomIndex = Math.floor(Math.random() * videoList.length);
            const fileId = videoList[randomIndex];
            
            const player = document.getElementById("drivePlayer");
            player.src = `https://drive.google.com/file/d/${fileId}/preview`;
        }

        fetchDriveVideos();
    </script>

</body>
</html>
